<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>売上分析 | ALTRY</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f0f4f8;
      --card: #fff;
      --text: #1a2332;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --up: #2563eb;
      --down: #dc2626;
      --c-kohoku: #059669;
      --c-nogata: #d97706;
      --c-minke: #7c3aed;
      --c-yuzawa: #0891b2;
      --c-total: #1d4ed8;
      --c-koseikai: #be185d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 20px; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 0;
      border-bottom: 2px solid var(--border); margin-bottom: 0;
      position: sticky; top: 0; z-index: 30;
      background: var(--bg);
      padding-top: 8px;
    }
    .tab {
      padding: 12px 20px; font-size: 0.9rem; background: none; border: none;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      cursor: pointer; color: var(--muted); font-weight: 500;
    }
    .tab.active { color: var(--text); font-weight: 700; border-bottom-color: var(--accent); }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
      margin-bottom: 16px;
      position: sticky; top: var(--tabs-h, 52px); z-index: 29;
      background: var(--bg);
      padding: 12px 0 12px;
      border-bottom: 1px solid var(--border);
    }
    .compare-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-height: 44px;
    }
    .compare-toggles .toggle-title {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px;
    }
    .compare-toggles label.compare-opt {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .compare-toggles input {
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
    }
    .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
    .swatch.cur { background: #2563eb; }
    .swatch.prev { background: #f97316; }
    .swatch.prev2 { background: #ec4899; }
    .swatch.prev3 { background: #a855f7; }
    .fiscal-summary {
      flex: 1;
      min-width: 280px;
    }
    .fiscal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }
    .fiscal-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .fiscal-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
      align-items: start;
      margin-top: 8px;
    }
    .fiscal-row .fiscal-block {
      min-width: 0;
    }
    .fiscal-summary .fiscal-label {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }
    .fiscal-summary .fiscal-period {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .fiscal-summary .fiscal-value {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      margin-top: 2px;
    }
    .fiscal-summary .fiscal-metric-lbl {
      font-size: 0.7rem;
      color: var(--muted);
    }
    .fiscal-summary .fiscal-metric-val {
      font-size: 0.95rem;
      font-weight: 700;
    }
    .fiscal-summary .fiscal-metric-val.up { color: var(--up); }
    .fiscal-summary .fiscal-metric-val.down { color: var(--down); }
    @media (max-width: 720px) {
      .fiscal-row { flex-direction: column; }
    }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--muted); }
    select {
      font-size: 0.95rem; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 8px; min-width: 220px; background: var(--card);
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 800px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .kpi-grid { grid-template-columns: 1fr; } }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 18px 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      border-top: 3px solid var(--accent);
      min-height: 168px;
      display: flex;
      flex-direction: column;
    }
    .kpi-card.accent-kohoku { border-top-color: var(--c-kohoku); }
    .kpi-card.accent-nogata { border-top-color: var(--c-nogata); }
    .kpi-card.accent-minke { border-top-color: var(--c-minke); }
    .kpi-card.accent-yuzawa { border-top-color: var(--c-yuzawa); }
    .kpi-card.accent-total { border-top-color: var(--c-total); }
    .kpi-card.accent-koseikai { border-top-color: var(--c-koseikai); }
    .kpi-grid.kpi-simple {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .kpi-grid.kpi-compact {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .kpi-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 8px;
      padding: 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
      line-height: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .kpi-title > span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
      line-height: 16px;
    }
    .kpi-days {
      font-weight: 600;
      white-space: nowrap;
      font-size: 12px;
      line-height: 16px;
      flex-shrink: 0;
    }
    .kpi-value {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: auto;
      padding-bottom: 8px;
    }
    .kpi-value.up { color: var(--up); }
    .kpi-value.down { color: var(--down); }
    .kpi-subline {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 10px;
      min-height: 1.1em;
    }
    .kpi-subline.up { color: var(--up); font-weight: 600; }
    .kpi-subline.down { color: var(--down); font-weight: 600; }
    .kpi-subline.neutral { color: var(--text); font-weight: 600; }
    .kpi-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .kpi-sub { display: flex; flex-direction: column; gap: 2px; }
    .kpi-sub-lbl { font-size: 0.65rem; color: var(--muted); white-space: nowrap; line-height: 1.3; }
    .kpi-sub-val { font-size: 0.88rem; font-weight: 600; }
    .kpi-sub-val.up { color: var(--up); }
    .kpi-sub-val.down { color: var(--down); }
    .kpi-sub-val.neutral { color: var(--text); }
    .kpi-compare.single {
      grid-template-columns: 1fr;
      justify-items: start;
      text-align: left;
    }
    .kpi-compare.single .kpi-sub { align-items: flex-start; }
    .kpi-compare.single .kpi-sub-lbl { font-size: 0.68rem; }
    .kpi-compare.single .kpi-sub-val { font-size: 1.05rem; }
    .kpi-shortfall {
      gap: 0;
    }
    .kpi-shortfall .kpi-value {
      font-size: 1.6rem;
      margin-bottom: 0;
      padding-bottom: 10px;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .kpi-shortfall-day {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .kpi-shortfall-day .kpi-title {
      margin-bottom: 8px;
    }
    .kpi-shortfall-day .kpi-value {
      padding-bottom: 0;
    }
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .charts-grid .chart-card.full {
      grid-column: 1 / -1;
    }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 16px 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    .chart-card h2 {
      font-size: 0.95rem;
      margin: 0 0 4px;
      font-weight: 700;
    }
    .chart-card .cap {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .chart-box {
      position: relative;
      height: 280px;
    }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>

                label: (ctx) => `${ctx.dataset.label}: ${tickFn(ctx.parsed.y)}`,
                footer: (items) => {
                  const total = items.reduce((s, it) => s + (it.parsed.y || 0), 0);
                  const label = manYenLabel(total);
                  return label ? `合計: ${label}` : "";
                },
              },
            },
          },
          scales: {
            x: {
              stacked: true,
              ticks: { maxRotation: 0, minRotation: 0, autoSkip: false, font: { size: 10 } },
              grid: { display: false },
            },
            y: {
              stacked: true,
              beginAtZero: true,
              ticks: { callback: (v) => tickFn(v), font: { size: 10 } },
              grid: { color: "#eef2f7" },
            },
          },
        },
      });
    }
    function destroyClinicCharts(clinic) {
      const bag = chartRegistry[clinic];
      if (!bag) return;
      Object.values(bag).forEach((c) => c && c.destroy());
      delete chartRegistry[clinic];
    }
    function shiftYearKey(key, yearsBack) {
      return key - yearsBack * 100;
    }
    function fiscalAxisLabel(key) {
      return `${key % 100}月`;
    }
    function valueAtMap(map, key, field) {
      const rec = map.get(key);
      if (!rec) return null;
      const v = rec[field];
      return v == null ? null : v;
    }
    function buildFiscalCompareSeries(clinic, field, selectedKey) {
      const fy = fiscalYearOf(selectedKey, clinic);
      const keys = fiscalRangeKeys(fy, clinic);
      const map = new Map((DATA.clinics[clinic].months || []).map((m) => [m.key, m]));
      const labels = keys.map((k) => fiscalAxisLabel(k));
      const current = keys.map((k) => valueAtMap(map, k, field));
      const previous = keys.map((k) => valueAtMap(map, shiftYearKey(k, 1), field));
      const previous2 = keys.map((k) => valueAtMap(map, shiftYearKey(k, 2), field));
      const previous3 = keys.map((k) => valueAtMap(map, shiftYearKey(k, 3), field));
      return { labels, keys, current, previous, previous2, previous3, fy, periodLabel: fiscalPeriodLabel(fy, clinic) };
    }
    function buildSelfPayStack(clinic, selectedKey) {
      const parts = DATA.clinics[clinic].selfPayParts || [];
      const fy = fiscalYearOf(selectedKey, clinic);
      const keys = fiscalRangeKeys(fy, clinic);
      const labels = keys.map((k) => fiscalAxisLabel(k));
      const datasets = parts.map((part, i) => {
        const map = new Map((part.series || []).map((p) => [p.key, p.value]));
        return {
          label: part.label,
          data: keys.map((k) => map.has(k) ? map.get(k) : 0),
          backgroundColor: selfPayColor(part.label, i),
          borderWidth: 0,
          stack: "selfpay",
          monthKeys: keys,
          yearsBack: 0,
        };
      });
      return { labels, datasets, fy, periodLabel: fiscalPeriodLabel(fy, clinic) };
    }
    function makeCompareBarChart(canvas, labels, seriesList, tickFn) {
      // seriesList: [{label, data, color}] left-to-right order; current should be last
      const datasets = seriesList.map((s) => ({
        label: s.label,
        data: s.data,
        backgroundColor: s.color + (s.alpha || "cc"),
        borderColor: s.color,
        borderWidth: 1,
        borderRadius: 3,
        monthKeys: s.monthKeys || null,
        yearsBack: s.yearsBack || 0,
      }));
      return new Chart(canvas, {
        type: "bar",
        data: { labels, datasets },
          options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          onClick: barChartClick,
          onHover: barChartHover,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${tickFn(ctx.parsed.y)}`,
              },
            },
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: (v) => tickFn(v), font: { size: 10 } },
              grid: { color: "#eef2f7" },
            },
            x: {
              ticks: { maxRotation: 0, minRotation: 0, autoSkip: false, font: { size: 10 } },
              grid: { display: false },
            },
          },
        },
      });
    }
    function yoySeriesList(bundle, currentLabel) {
      // 左→右: 前前前年 / 前々年 / 前年 / 当期
      const keys = bundle.keys || [];
      const list = [];
      const add = (label, data, color, alpha, yearsBack) => {
        list.push({
          label,
          data,
          color,
          alpha,
          yearsBack,
          monthKeys: keys.map((k) => shiftYearKey(k, yearsBack)),
        });
      };
      if (showPrev3Year) add("前前前年同月", bundle.previous3, CHART_COLORS.previous3, "e6", 3);
      if (showPrev2Year) add("前々年同月", bundle.previous2, CHART_COLORS.previous2, "e6", 2);
      if (showPrevYear) add("前年同月", bundle.previous, CHART_COLORS.previous, "e6", 1);
      add(currentLabel, bundle.current, CHART_COLORS.current, "cc", 0);
      return list;
    }
    function yoyCapText() {
      const parts = [];
      if (showPrev3Year) parts.push("紫=前前前年");
      if (showPrev2Year) parts.push("ピンク=前々年");
      if (showPrevYear) parts.push("オレンジ=前年");
      parts.push("青=当期");
      return parts.join(" / ");
    }
    function renderCharts(clinic) {
      destroyClinicCharts(clinic);
      const info = DATA.clinics[clinic] || {};
      const hidePatientUnitCharts = !!info.hidePatientUnitCharts;
      const bag = {};
      const sales = buildFiscalCompareSeries(clinic, "sales", activeKey);
      bag.salesYoy = makeCompareBarChart(
        document.getElementById(`chart-sales-yoy-${clinic}`),
        sales.labels,
        yoySeriesList(sales, "当期売上"),
        yenTick
      );
      const patientsCanvas = document.getElementById(`chart-patients-yoy-${clinic}`);
      if (patientsCanvas && !hidePatientUnitCharts) {
        const patients = buildFiscalCompareSeries(clinic, "patients", activeKey);
        bag.patientsYoy = makeCompareBarChart(
          patientsCanvas,
          patients.labels,
          yoySeriesList(patients, "当期患者数"),
          (v) => Math.round(v).toLocaleString("ja-JP") + "人"
        );
      }
      const unitCanvas = document.getElementById(`chart-unit-yoy-${clinic}`);
      if (unitCanvas && !hidePatientUnitCharts) {
        const units = buildFiscalCompareSeries(clinic, "unitPrice", activeKey);
        bag.unitYoy = makeCompareBarChart(
          unitCanvas,
          units.labels,
          yoySeriesList(units, "当期一人あたり単価"),
          yenTick
        );
      }
      const insuranceCanvas = document.getElementById(`chart-insurance-yoy-${clinic}`);
      if (insuranceCanvas) {
        const insurance = buildFiscalCompareSeries(clinic, "insuranceSales", activeKey);
        bag.insuranceYoy = makeCompareBarChart(
          insuranceCanvas,
          insurance.labels,
          yoySeriesList(insurance, info.insuranceSeriesLabel || "当期保険診療"),
          yenTick
        );
      }
      const selfPay = buildSelfPayStack(clinic, activeKey);
      const selfPayCanvas = document.getElementById(`chart-selfpay-${clinic}`);
      if (selfPayCanvas && selfPay.datasets.length) {
        bag.selfPay = makeStackedBarChart(selfPayCanvas, selfPay.labels, selfPay.datasets, yenTick);
      }
      // update captions for active panel
      const panel = document.getElementById("panel-" + clinic);
      if (panel) {
        panel.querySelectorAll(".cap-yoy").forEach((el) => {
          el.textContent = `${sales.periodLabel} ／ ${yoyCapText()}`;
        });
      }
      const selfCap = document.getElementById(`cap-selfpay-${clinic}`);
      if (selfCap && selfCap.dataset.base) {
        selfCap.textContent = `${selfPay.periodLabel} ／ ${selfCap.dataset.base}`;
      }
      chartRegistry[clinic] = bag;
    }
    function subMetric(lbl, val, tone) {
      return `<div class="kpi-sub"><span class="kpi-sub-lbl">${lbl}</span><span class="kpi-sub-val ${tone}">${val === "" ? "—" : val}</span></div>`;
    }
    function renderKpis(clinic, key) {
      const cur = monthByKey(clinic, key);
      const prevKey = prevYearKey(key);
      const prev = monthByKey(clinic, prevKey);
      const accent = COLORS[clinic] || "total";
      const info = DATA.clinics[clinic];
      const patientUnit = "人";
      const simple = !!info.simpleMode;
      const hidePatientUnit = !!info.hidePatientUnit;

      const sales = cur?.sales ?? null;
      const salesPrev = prev?.sales ?? null;
      const salesDiff = sales != null && salesPrev != null ? sales - salesPrev : null;
      const assessment = cur?.assessment ?? null;
      const showAssessment = clinic === "みんなの血管外科池袋";
      const days = cur?.days ?? null;
      const daysLabel = days != null ? `日数 ${Math.round(days)}日` : "";

      const patients = cur?.patients ?? null;
      const patientsPrev = prev?.patients ?? null;
      const patientsDiff = patients != null && patientsPrev != null ? patients - patientsPrev : null;
      const dailyPatients = cur?.dailyPatients ?? null;

      const unitPrice = cur?.unitPrice ?? null;
      const unitPricePrev = prev?.unitPrice ?? null;
      const unitPriceDiff = unitPrice != null && unitPricePrev != null ? unitPrice - unitPricePrev : null;

      let html = `
        <div class="kpi-card accent-${accent}">
          <div class="kpi-title"><span>${info.salesTitle || "月次売上（保険＋自費）"}</span><span class="kpi-days">${daysLabel}</span></div>
          <div class="kpi-value">${yen(sales) || "—"}</div>
          ${showAssessment ? `<div class="kpi-subline ${toneDiff(assessment)}">査定増減 ${diffYen(assessment) || "—"}</div>` : ""}
          <div class="kpi-compare">
            ${subMetric("前年売上", yen(salesPrev), toneValue(salesPrev))}
            ${subMetric("前年対比", diffYen(salesDiff), toneDiff(salesDiff))}
          </div>
        </div>`;
      if (!hidePatientUnit) {
        html += `
        <div class="kpi-card accent-${accent}">
          <div class="kpi-title"><span>患者数（${info.patientLabel}）</span></div>
          <div class="kpi-value">${count(patients, patientUnit) || "—"}</div>
          <div class="kpi-subline">${dailyPatients != null ? `${count(dailyPatients, "人/日")}` : ""}</div>
          <div class="kpi-compare">
            ${subMetric("前年患者数", count(patientsPrev, patientUnit), toneValue(patientsPrev))}
            ${subMetric("前年対比", diffCount(patientsDiff, patientUnit), toneDiff(patientsDiff))}
          </div>
        </div>
        <div class="kpi-card accent-${accent}">
          <div class="kpi-title"><span>一人あたり単価（${info.unitPriceLabel}）</span></div>
          <div class="kpi-value">${yen(unitPrice) || "—"}</div>
          <div class="kpi-compare">
            ${subMetric("前年一人あたり単価", yen(unitPricePrev), toneValue(unitPricePrev))}
            ${subMetric("前年対比", diffYen(unitPriceDiff), toneDiff(unitPriceDiff))}
          </div>
        </div>`;
      }
      return html;
    }
    function renderPanel(clinic) {
      const info = DATA.clinics[clinic] || {};
      const simple = !!info.simpleMode;
      const hidePatientUnit = !!info.hidePatientUnit;
      const hidePatientUnitCharts = !!info.hidePatientUnitCharts;
      const hideShortfall = !!info.hideShortfall;
      let chartNum = 1;
      const nextNum = () => "①②③④⑤⑥⑦⑧⑨⑩"[chartNum++ - 1] || String(chartNum - 1);
      const charts = [
        `<div class="chart-card">
            <h2>${nextNum()} 月次売上高の推移</h2>
            <p class="cap cap-yoy">会計年度1年分</p>
            <div class="chart-box"><canvas id="chart-sales-yoy-${clinic}"></canvas></div>
          </div>`,
      ];
      if (!hidePatientUnitCharts) {
        charts.push(`<div class="chart-card">
            <h2>${nextNum()} 患者数の推移</h2>
            <p class="cap cap-yoy">会計年度1年分</p>
            <div class="chart-box"><canvas id="chart-patients-yoy-${clinic}"></canvas></div>
          </div>`);
        charts.push(`<div class="chart-card">
            <h2>${nextNum()} 一人あたり単価の推移</h2>
            <p class="cap cap-yoy">会計年度1年分</p>
            <div class="chart-box"><canvas id="chart-unit-yoy-${clinic}"></canvas></div>
          </div>`);
      }
      charts.push(`<div class="chart-card full">
            <h2>${nextNum()} ${info.insuranceChartTitle || "保険診療売上"}の推移</h2>
            <p class="cap cap-yoy">会計年度1年分</p>
            <div class="chart-box"><canvas id="chart-insurance-yoy-${clinic}"></canvas></div>
          </div>`);
      let selfPayTitleBase = "自費金額の内訳";
      let selfPayCapBase = "月ごとの自費内訳（シルガード・健診・インフルエンザ等）";
      if (simple) {
        selfPayTitleBase = "自費金額";
        selfPayCapBase = "月ごとの自費金額合計";
      } else if (clinic === "みんなの血管外科池袋") {
        selfPayTitleBase = "OPE以外の売上";
        selfPayCapBase = "月ごとのOPE以外の売上";
      }
      charts.push(`<div class="chart-card full">
            <h2>${nextNum()} ${selfPayTitleBase}の推移</h2>
            <p class="cap" id="cap-selfpay-${clinic}" data-base="${selfPayCapBase}">${selfPayCapBase}</p>
            <div class="chart-box"><canvas id="chart-selfpay-${clinic}"></canvas></div>
          </div>`);
      const kpiClass = simple ? " kpi-simple" : (hidePatientUnit && hideShortfall ? " kpi-compact" : "");
      return `
        <div class="toolbar">
          <label>対象月
            <select id="month-select-${clinic}"></select>
          </label>
          <div class="compare-toggles">
            <span class="toggle-title">グラフ比較</span>
            <span class="compare-opt"><span class="swatch cur"></span>当期</span>
            <label class="compare-opt"><input type="checkbox" class="chk-prev" ${showPrevYear ? "checked" : ""}> <span class="swatch prev"></span>前年</label>
            <label class="compare-opt"><input type="checkbox" class="chk-prev2" ${showPrev2Year ? "checked" : ""}> <span class="swatch prev2"></span>前々年</label>
            <label class="compare-opt"><input type="checkbox" class="chk-prev3" ${showPrev3Year ? "checked" : ""}> <span class="swatch prev3"></span>前前前年</label>
          </div>
          <div class="fiscal-summary" id="fiscal-${clinic}">${renderFiscalSummary(clinic, activeKey)}</div>
        </div>
        <div class="kpi-grid${kpiClass}" id="kpi-${clinic}">${renderKpis(clinic, activeKey)}</div>
        <div class="charts-grid">
          ${charts.join("\n")}
        </div>`;
    }
    function syncCompareToggles(panel) {
      if (!panel) return;
      const prev = panel.querySelector(".chk-prev");
      const prev2 = panel.querySelector(".chk-prev2");
      const prev3 = panel.querySelector(".chk-prev3");
      if (prev) prev.checked = showPrevYear;
      if (prev2) prev2.checked = showPrev2Year;
      if (prev3) prev3.checked = showPrev3Year;
    }
    function keyFor(clinic) {
      const months = (DATA.clinics[clinic] && DATA.clinics[clinic].months) || [];
      if (months.some((m) => m.key === activeKey)) return activeKey;
      return months.length ? months[months.length - 1].key : activeKey;
    }
    function refresh(opts) {
      opts = opts || {};
      const key = keyFor(activeClinic);
      document.getElementById("kpi-" + activeClinic).innerHTML = renderKpis(activeClinic, key);
      const fiscalEl = document.getElementById("fiscal-" + activeClinic);
      if (fiscalEl) fiscalEl.innerHTML = renderFiscalSummary(activeClinic, key);
      const panel = document.getElementById("panel-" + activeClinic);
      syncCompareToggles(panel);
      if (!opts.keepCharts) renderCharts(activeClinic);
    }
    function setClinic(id) {
      activeClinic = id;
      document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.clinic === id));
      document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + id));
      const sel = document.getElementById("month-select-" + id);
      if (sel && !sel.options.length) fillMonthSelect(sel, id);
      if (sel) sel.value = String(keyFor(id));
      refresh();
    }
    function init() {
      const tabsEl = document.getElementById("tabs");
      const panelsEl = document.getElementById("panels");
      DATA.clinicOrder.forEach((name, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab" + (i === 0 ? " active" : "");
        btn.dataset.clinic = name;
        btn.textContent = name;
        btn.addEventListener("click", () => setClinic(name));
        tabsEl.appendChild(btn);

        const panel = document.createElement("div");
        panel.id = "panel-" + name;
        panel.className = "panel" + (i === 0 ? " active" : "");
        panel.innerHTML = renderPanel(name);
        panelsEl.appendChild(panel);

        const sel = panel.querySelector("select");
        const months = DATA.clinics[name].months || [];
        fillMonthSelect(sel, name);
        sel.value = months.length ? months[months.length - 1].key : "";
        sel.addEventListener("change", () => {
          const next = Number(sel.value);
          const keep = fiscalYearOf(next, activeClinic) === fiscalYearOf(activeKey, activeClinic);
          activeKey = next;
          refresh({ keepCharts: keep });
        });
        const prevChk = panel.querySelector(".chk-prev");
        const prev2Chk = panel.querySelector(".chk-prev2");
        const prev3Chk = panel.querySelector(".chk-prev3");
        if (prevChk) {
          prevChk.addEventListener("change", () => {
            showPrevYear = prevChk.checked;
            document.querySelectorAll(".chk-prev").forEach((el) => { el.checked = showPrevYear; });
            renderCharts(activeClinic);
          });
        }
        if (prev2Chk) {
          prev2Chk.addEventListener("change", () => {
            showPrev2Year = prev2Chk.checked;
            document.querySelectorAll(".chk-prev2").forEach((el) => { el.checked = showPrev2Year; });
            renderCharts(activeClinic);
          });
        }
        if (prev3Chk) {
          prev3Chk.addEventListener("change", () => {
            showPrev3Year = prev3Chk.checked;
            document.querySelectorAll(".chk-prev3").forEach((el) => { el.checked = showPrev3Year; });
            renderCharts(activeClinic);
          });
        }
      });
      activeKey = Number(document.querySelector(".panel.active select").value);
      renderCharts(activeClinic);
      const tabsElSticky = document.getElementById("tabs");
      const syncStickyTabsHeight = () => {
        if (!tabsElSticky) return;
        document.documentElement.style.setProperty("--tabs-h", tabsElSticky.offsetHeight + "px");
      };
      syncStickyTabsHeight();
      if (window.ResizeObserver) {
        new ResizeObserver(syncStickyTabsHeight).observe(tabsElSticky);
      } else {
        window.addEventListener("resize", syncStickyTabsHeight);
      }
    }
    init();
  </script>
</body>
</html>
